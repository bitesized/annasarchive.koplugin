name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua-check
          luacheck .

      - name: Check the version in _meta.lua matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' _meta.lua)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match version $VERSION in _meta.lua" >&2
            exit 1
          fi

      # KOReader loads a plugin from a directory whose name ends in
      # .koplugin, so the zip has to unpack to one -- downloading the
      # repository's own zip gives you "-main" on the end and no plugin.
      - name: Build the plugin zip
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist/annasarchive.koplugin
          # Copy everything except repo plumbing, so a future subdirectory
          # (l10n/, icons/) isn't silently left out of the zip.
          rsync -a --exclude '.git*' --exclude '.github' --exclude '.claude' \
            --exclude '.luacheckrc' --exclude 'dist' ./ dist/annasarchive.koplugin/
          cd dist && zip -r "../annasarchive.koplugin-$TAG.zip" annasarchive.koplugin
          cd .. && sha256sum "annasarchive.koplugin-$TAG.zip" > "annasarchive.koplugin-$TAG.zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            annasarchive.koplugin-*.zip
            annasarchive.koplugin-*.zip.sha256
          generate_release_notes: true
          body: |
            Unzip into KOReader's `plugins/` folder. The zip already contains a
            correctly named `annasarchive.koplugin/` directory, so there is
            nothing to rename. Restart KOReader afterwards.
